# Publishes one package to PyPI when its tag is pushed.
#
# Tags are <driver>-<version> (for example qwiic_bme280-3.0.1),
# qwiic_i2c-<version> for the bus layer, or qwiic-<version> for the
# sparkfun-qwiic meta-package. The version must match
# the package's pyproject.toml.
#
# Uses PyPI trusted publishing: each PyPI project needs a trusted publisher for
# this repository, this workflow (release.yml) and the "pypi" environment.
name: Release

on:
  push:
    tags: ["*-[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Find the package for this tag
        id: package
        run: |
          tag="$GITHUB_REF_NAME"
          name="${tag%-*}"
          version="${tag##*-}"
          case "$name" in
            qwiic|qwiic_i2c) dir="$name" ;;
            *) dir="drivers/$name" ;;
          esac
          if [ ! -f "$dir/pyproject.toml" ]; then
            echo "::error::No package for tag $tag ($dir/pyproject.toml not found)"; exit 1
          fi
          actual=$(python -c "import tomllib; print(tomllib.load(open('$dir/pyproject.toml', 'rb'))['project']['version'])")
          if [ "$actual" != "$version" ]; then
            echo "::error::Tag says $version but $dir/pyproject.toml says $actual"; exit 1
          fi
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
      - run: pip install build mpy-cross
      - name: Check the package before publishing
        if: steps.package.outputs.dir != 'qwiic'
        run: python tools/check_driver.py "$(basename '${{ steps.package.outputs.dir }}')"
      - run: python -m build --sdist --wheel --outdir dist "${{ steps.package.outputs.dir }}"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
