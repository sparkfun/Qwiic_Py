# Lint rules CI enforces (see CONTRIBUTING.md). Style is not enforced beyond these.
target-version = "py38"
line-length = 200
extend-exclude = ["docs/doxygen"]

[lint]
select = [
    "E9", "F63", "F7", "F82",   # syntax errors and undefined names
    "E722",                     # bare except
    "N801", "N802", "N803",     # PEP 8 class, function and argument names
    "T201",                     # print() in a driver
]

[lint.per-file-ignores]
"drivers/*/examples/*" = ["T201"]
"tools/*" = ["T201"]
"tests/*" = ["T201"]
