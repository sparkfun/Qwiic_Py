[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkfun-qwiic-vl53l5cx"
version = "3.0.0"
description = "SparkFun Qwiic VL53L5CX 8x8 time-of-flight imager driver"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{name = "SparkFun Electronics", email = "info@sparkfun.com"}]
dependencies = ["sparkfun-qwiic-i2c>=3.0,<4"]
keywords = ["electronics", "maker", "qwiic", "vl53l5cx"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://www.sparkfun.com/qwiic"
Documentation = "https://docs.sparkfun.com/Qwiic_Py/qwiic_vl53l5cx/"
Source = "https://github.com/sparkfun/Qwiic_Py/tree/main/drivers/qwiic_vl53l5cx"
Issues = "https://github.com/sparkfun/Qwiic_Py/issues"

[tool.setuptools]
packages = ["qwiic_vl53l5cx"]

[tool.setuptools.package-data]
qwiic_vl53l5cx = ["vl53l5cx_bin/*.bin"]
