[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkfun-ublox-gps"
version = "3.0.0"
description = "SparkFun u-blox GPS driver for serial and SPI (Linux)"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.8"
authors = [{name = "SparkFun Electronics", email = "info@sparkfun.com"}]
dependencies = ["pyserial", "spidev; sys_platform == 'linux'"]
keywords = ["electronics", "maker", "qwiic", "gps", "u-blox", "ublox"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://www.sparkfun.com/qwiic"
Documentation = "https://docs.sparkfun.com/Qwiic_Py/ublox_gps/"
Source = "https://github.com/sparkfun/Qwiic_Py/tree/main/drivers/ublox_gps"
Issues = "https://github.com/sparkfun/Qwiic_Py/issues"

[tool.setuptools]
packages = ["ublox_gps"]

[tool.qwiic]
platforms = ["cpython"]
