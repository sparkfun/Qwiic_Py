[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkfun-qwiic-oled-base"
version = "3.0.0"
description = "SparkFun Qwiic OLED (SSD1306) display driver: Micro OLED, 0.91in 128x32 and 1.3in 128x64"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{name = "SparkFun Electronics", email = "info@sparkfun.com"}]
dependencies = ["sparkfun-qwiic-i2c>=3.0,<4"]
keywords = ["electronics", "maker", "qwiic", "ssd1306", "oled"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://www.sparkfun.com/qwiic"
Documentation = "https://docs.sparkfun.com/Qwiic_Py/qwiic_oled/"
Source = "https://github.com/sparkfun/Qwiic_Py/tree/main/drivers/qwiic_oled"
Issues = "https://github.com/sparkfun/Qwiic_Py/issues"

[tool.setuptools]
packages = ["qwiic_oled"]

[tool.setuptools.package-data]
qwiic_oled = ["fonts/*.bin"]
