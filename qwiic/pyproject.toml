[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sparkfun-qwiic"
version = "3.0.0"
description = "SparkFun Qwiic Python package: every Qwiic driver, plus device discovery"
readme = "README.md"
license = "MIT"
requires-python = ">=3.8"
authors = [{name = "SparkFun Electronics", email = "info@sparkfun.com"}]
# Generated by tools/gen_registry.py
dependencies = [
    "sparkfun-qwiic-i2c>=3.0.0,<4",
    "sparkfun-pi-servo-hat>=3.0.0,<4",
    "sparkfun-qwiic-ads1015>=3.0.0,<4",
    "sparkfun-qwiic-adxl313>=3.0.0,<4",
    "sparkfun-qwiic-alphanumeric>=3.0.0,<4",
    "sparkfun-qwiic-as6212>=3.0.0,<4",
    "sparkfun-qwiic-as7265x>=3.0.0,<4",
    "sparkfun-qwiic-as726x>=3.0.0,<4",
    "sparkfun-qwiic-as7343>=3.0.0,<4",
    "sparkfun-qwiic-bme280>=3.0.0,<4",
    "sparkfun-qwiic-bmp581>=3.0.0,<4",
    "sparkfun-qwiic-button>=3.0.0,<4",
    "sparkfun-qwiic-cap1203>=3.0.0,<4",
    "sparkfun-qwiic-ccs811>=3.0.0,<4",
    "sparkfun-qwiic-cy8cmbr3>=3.0.0,<4",
    "sparkfun-qwiic-dual-encoder-reader>=3.0.0,<4",
    "sparkfun-qwiic-eeprom>=3.0.0,<4",
    "sparkfun-qwiic-ens160>=3.0.0,<4",
    "sparkfun-qwiic-fs3000>=3.0.0,<4",
    "sparkfun-qwiic-gpio>=3.0.0,<4",
    "sparkfun-qwiic-huskylens>=3.0.0,<4",
    "sparkfun-qwiic-icm20948>=3.0.0,<4",
    "sparkfun-qwiic-ism330dhcx>=3.0.0,<4",
    "sparkfun-qwiic-joystick>=3.0.0,<4",
    "sparkfun-qwiic-keypad>=3.0.0,<4",
    "sparkfun-qwiic-kx13x>=3.0.0,<4",
    "sparkfun-qwiic-led-stick>=3.0.0,<4",
    "sparkfun-qwiic-lsm6dso>=3.0.0,<4",
    "sparkfun-qwiic-max1704x>=3.0.0,<4",
    "sparkfun-qwiic-max3010x>=3.0.0,<4",
    "sparkfun-qwiic-mcp4725>=3.0.0,<4",
    "sparkfun-qwiic-mcp9600>=3.0.0,<4",
    "sparkfun-qwiic-micropressure>=3.0.0,<4",
    "sparkfun-qwiic-mmc5983ma>=3.0.0,<4",
    "sparkfun-qwiic-nau7802>=3.0.0,<4",
    "sparkfun-qwiic-oled-base>=3.0.0,<4",
    "sparkfun-qwiic-otos>=3.0.0,<4",
    "sparkfun-qwiic-pca9685>=3.0.0,<4",
    "sparkfun-qwiic-pir>=3.0.0,<4",
    "sparkfun-qwiic-proximity>=3.0.0,<4",
    "sparkfun-qwiic-relay>=3.0.0,<4",
    "sparkfun-qwiic-rfid>=3.0.0,<4",
    "sparkfun-qwiic-rv8803>=3.0.0,<4",
    "sparkfun-qwiic-scd4x>=3.0.0,<4",
    "sparkfun-qwiic-scmd>=3.0.0,<4",
    "sparkfun-qwiic-serlcd>=3.0.0,<4",
    "sparkfun-qwiic-sgp40>=3.0.0,<4",
    "sparkfun-qwiic-soil-moisture-sensor>=3.0.0,<4",
    "sparkfun-qwiic-tca9548a>=3.0.0,<4",
    "sparkfun-qwiic-titan-gps>=3.0.0,<4",
    "sparkfun-qwiic-tmp102>=3.0.0,<4",
    "sparkfun-qwiic-tmp117>=3.0.0,<4",
    "sparkfun-qwiic-twist>=3.0.0,<4",
    "sparkfun-qwiic-ultrasonic>=3.0.0,<4",
    "sparkfun-qwiic-veml6030>=3.0.0,<4",
    "sparkfun-qwiic-vl53l1x>=3.0.0,<4",
    "sparkfun-qwiic-vl53l5cx>=3.0.0,<4",
    "sparkfun-top-phat-button>=3.0.0,<4",
    "sparkfun-ublox-gps>=3.0.0,<4",
]
keywords = ["electronics", "maker", "qwiic", "i2c"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: MicroPython",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://www.sparkfun.com/qwiic"
Documentation = "https://qwiic-py.readthedocs.io/"
Source = "https://github.com/sparkfun/Qwiic_Py"
Issues = "https://github.com/sparkfun/Qwiic_Py/issues"

[tool.setuptools]
py-modules = ["qwiic", "qwiic_registry"]
